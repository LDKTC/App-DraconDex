name: Build Flutter APK

# Pull requests / branch pushes only build + upload workflow artifacts (30-day
# retention). Pushing a flutter-v* tag additionally publishes the APKs as
# GitHub release assets — mirrors build-electron.yml's v* tag convention, but
# with its own prefix since the Electron app's package.json version and the
# Flutter app's pubspec.yaml version are independent numbers that happen to
# both look like "vX.Y.Z".

on:
  push:
    branches:
      - main
      - claude/apk-run-prep-q0ct2l
    tags:
      - 'flutter-v*'
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: flutter-v<version from pubspec.yaml>)'
        required: false
        default: ''
      draft:
        description: 'Publish as a draft release'
        type: boolean
        default: true
      prerelease:
        description: 'Mark the release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # flutter/assets/ is a committed mirror of the shared masters in
      # src/assets/ (pubspec cannot reach outside the package dir). Fail loudly
      # if someone edited the mirror instead of the master.
      - name: Check shared assets are in sync
        run: node src/sync-assets.mjs --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Resolve version and release tag
        id: meta
        run: |
          version="$(grep -m1 '^version:' flutter/pubspec.yaml | sed -E 's/^version:\s*([0-9.]+).*/\1/')"
          tag='${{ github.event.inputs.tag }}'
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "$tag" ]]; then
            tag="flutter-v$version"
          fi
          if [[ "${tag#flutter-v}" != "$version" ]]; then
            echo "::warning::Tag '$tag' does not match pubspec.yaml version '$version'."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag"

      - name: Build release APK (split per ABI)
        working-directory: flutter
        run: flutter build apk --release --split-per-abi

      - name: Build release APK (universal)
        working-directory: flutter
        run: flutter build apk --release

      - name: Collect release assets
        run: |
          set -euo pipefail
          version='${{ steps.meta.outputs.version }}'
          dist='dist-release'
          mkdir -p "$dist"
          shopt -s nullglob
          apks=(flutter/build/app/outputs/flutter-apk/app-*-release.apk flutter/build/app/outputs/flutter-apk/app-release.apk)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No release APKs found" >&2
            exit 1
          fi
          for f in "${apks[@]}"; do
            base="$(basename "$f" .apk)"
            cp "$f" "$dist/DraconDex-$version-${base#app-}.apk"
          done
          ( cd "$dist" && sha256sum * > checksums-sha256.txt )
          ls -lh "$dist" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-apks
          path: dist-release/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='${{ steps.meta.outputs.tag }}'
          version='${{ steps.meta.outputs.version }}'
          files=(dist-release/*)

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists - uploading assets."
            gh release upload "$tag" --clobber "${files[@]}"
          else
            args=(release create "$tag" --title "DraconDex APK $version" --generate-notes)
            if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
              # A manual run may target a tag that does not exist yet; gh
              # creates it from the checked-out commit.
              [[ '${{ github.event.inputs.draft }}' == 'true' ]] && args+=(--draft)
              [[ '${{ github.event.inputs.prerelease }}' == 'true' ]] && args+=(--prerelease)
            else
              args+=(--verify-tag)
            fi
            gh "${args[@]}" "${files[@]}"
          fi
