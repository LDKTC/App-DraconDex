name: Build Flutter APK

on:
  push:
    branches:
      - main
      - claude/apk-run-prep-q0ct2l
    paths:
      - 'flutter/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # flutter/assets/ is a committed mirror of the shared masters in
      # src/assets/ (pubspec cannot reach outside the package dir). Fail loudly
      # if someone edited the mirror instead of the master.
      - name: Check shared assets are in sync
        run: node src/sync-assets.mjs --check

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: flutter
        run: flutter pub get

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: flutter
        run: flutter test

      - name: Build release APK (split per ABI)
        working-directory: flutter
        run: flutter build apk --release --split-per-abi

      - name: Build release APK (universal)
        working-directory: flutter
        run: flutter build apk --release

      - name: Upload APKs
        uses: actions/upload-artifact@v6
        with:
          name: release-apks
          path: |
            flutter/build/app/outputs/flutter-apk/app-*-release.apk
            flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
