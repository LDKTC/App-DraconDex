name: dracondex
description: "DraconDex - Novel data management app"
publish_to: 'none'
version: 2.3.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Settings persistence
  shared_preferences: ^2.3.5

  # File import/export
  file_picker: ^9.0.1
  share_plus: ^10.1.4

  # Color picker
  flutter_colorpicker: ^1.1.0

  # Relations force-directed graph
  graphview: ^1.2.0

  # Internationalization
  intl: ^0.20.2

  cupertino_icons: ^1.0.8

  # Update-check notice (GitHub Releases) — see docs/UPDATE.md
  http: ^1.2.2
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# generate is off because the custom "qd" (Draconic) locale is rejected by
# newer gen-l10n validation; the generated files in lib/core/i18n are committed.
flutter:
  uses-material-design: true
  generate: false

  assets:
    - assets/images/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
