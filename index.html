<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Novel Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="window-frame">
<header id="title-tab-bar">
  <div class="tab-brand" title="DraconDex">
    <img src="Image/DraconDex-SymbolWhite.png" class="brand-img" alt="DraconDex">
  </div>
  <button id="hub-toggle-btn" class="hub-toggle" title="Toggle hub panel">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
  </button>
  <span id="titlebar-vault" class="titlebar-vault">DraconDex</span>
  <div class="title-drag"></div>
  <div id="settings-menu-wrap">
    <button class="title-settings-btn" id="settings-menu-btn" title="Settings" aria-haspopup="true" aria-expanded="false">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div id="settings-menu" class="hidden"></div>
  </div>
  <div id="window-controls">
    <button class="window-btn" id="win-min" title="Minimize">-</button>
    <button class="window-btn" id="win-max" title="Maximize">[]</button>
    <button class="window-btn close" id="win-close" title="Close">x</button>
  </div>
</header>
<div id="app">
  <nav id="nav-sidebar">
    <button class="nav-logo-btn" id="nav-logo-btn" title="DraconDex">
      <img src="Image/DraconDex-SymbolWhite.png" class="brand-img" alt="DraconDex">
    </button>
    <button class="nav-btn explorer-btn" data-panel="explorer" title="Explorer" style="display:none" onclick="openExplorer()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3h7v7H3z"/><path d="M14 3h7v7h-7z"/><path d="M14 14h7v7h-7z"/><path d="M3 14h7v7H3z"/>
      </svg>
    </button>
    <button class="nav-btn director-only" id="director-project-shortcut" title="Projects" aria-label="Projects" style="display:none" onclick="openDirectorProjectShortcut()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Director" style="display:none" onclick="selectModule('director')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
        <path d="m6.2 5.3 3.1 3.9"/>
        <path d="m12.4 3.4 3.1 3.9"/>
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Navigator" style="display:none" onclick="selectModule('navigator')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
    <button class="nav-btn navigator-only" data-panel="navigator" data-worldtab="original" title="Navigator" style="display:none" onclick="setWorldTab('original')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </button>
    <button class="nav-btn navigator-only" data-panel="navigator" data-worldtab="chars-cats" title="Characters & Categories" style="display:none" onclick="setWorldTab('chars-cats')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
    <button class="nav-btn navigator-only" data-panel="navigator" data-worldtab="maps-timeline" title="Map Timelines" style="display:none" onclick="setWorldTab('maps-timeline')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/></svg>
    </button>
    <button class="nav-btn navigator-only" data-panel="navigator" data-worldtab="tags" title="World Tags" style="display:none" onclick="setWorldTab('tags')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/>
        <line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/>
        <line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Hero" style="display:none" onclick="selectModule('hero')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
        <line x1="13" y1="19" x2="19" y2="13"/>
        <line x1="16" y1="16" x2="20" y2="20"/>
        <line x1="19" y1="21" x2="21" y2="19"/>
      </svg>
    </button>
    <button class="nav-btn hero-only" data-panel="hero" title="Hero" style="display:none" onclick="setGameTab('project')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="14.5 17.5 3 6 3 3 6 3 17.5 14.5"/>
        <line x1="13" y1="19" x2="19" y2="13"/>
        <line x1="16" y1="16" x2="20" y2="20"/>
        <line x1="19" y1="21" x2="21" y2="19"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Writer" style="display:none" onclick="selectModule('writer')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </button>
    <button class="nav-btn writer-only" data-panel="writer" title="Writer" style="display:none" onclick="setWriteTab('project')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Scribe" style="display:none" onclick="selectModule('scribe')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="m10.5 12.5 3 3L9 20l-3 1 1-3z"/>
      </svg>
    </button>
    <button class="nav-btn scribe-only" data-panel="scribe" title="Scribe" style="display:none" onclick="selectModule('scribe')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <path d="m10.5 12.5 3 3L9 20l-3 1 1-3z"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Sage" style="display:none" onclick="selectModule('sage')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
    </button>
    <button class="nav-btn sage-only" data-panel="sage" title="Sage" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
        <line x1="2" y1="20" x2="22" y2="20"/>
      </svg>
    </button>
    <button class="nav-btn nexus-only" title="Artisan" style="display:none" onclick="selectModule('artisan')">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/>
        <path d="m18 15 4-4"/>
        <path d="M21.5 11.5 19.586 9.586A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>
      </svg>
    </button>
    <button class="nav-btn artisan-only" data-panel="artisan" title="Artisan" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/>
        <path d="m18 15 4-4"/>
        <path d="M21.5 11.5 19.586 9.586A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>
      </svg>
    </button>
    <button class="nav-btn director-only" data-panel="projects" title="โปรเจกต์" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        <line x1="2" y1="10" x2="22" y2="10"/>
      </svg>
    </button>
    <button class="nav-btn project-only" data-panel="timeline" title="Timeline" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </button>
    <button class="nav-btn project-only" data-panel="relation" title="ความสัมพันธ์" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
    </button>
    <button class="nav-btn project-only" data-panel="map" title="Mapping" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polygon points="16.24,7.76 14.12,14.12 7.76,16.24 9.88,9.88"/>
      </svg>
    </button>
    <button class="nav-btn project-only" data-panel="project-hashtag" title="Project Tags" style="display:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/>
        <line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/>
        <line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
    </button>
    <button class="nav-btn artisan-shortcut" id="artisan-module-shortcut" title="Artisan" style="display:none" onclick="openArtisanFromModule()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9"/>
        <path d="m18 15 4-4"/>
        <path d="M21.5 11.5 19.586 9.586A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/>
      </svg>
    </button>
    <div style="flex:1"></div>
    <button class="nav-btn nav-util" id="btn-import-db" title="Import DB">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </button>
    <button class="nav-btn nav-util" id="btn-export-db" title="Export DB">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </button>
    <button class="nav-btn" data-panel="hashtag" title="ป้ายกำกับ">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="9" x2="20" y2="9"/>
        <line x1="4" y1="15" x2="20" y2="15"/>
        <line x1="10" y1="3" x2="8" y2="21"/>
        <line x1="16" y1="3" x2="14" y2="21"/>
      </svg>
    </button>
    <button class="nav-btn" data-panel="colors" title="สี">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <circle cx="7.5" cy="10.5" r="1.5"/>
        <circle cx="11.5" cy="7.5" r="1.5"/>
        <circle cx="16.5" cy="9.5" r="1.5"/>
        <circle cx="15.5" cy="14.5" r="1.5"/>
      </svg>
    </button>
  </nav>
  <aside id="left-panel">
    <div id="search-bar">
      <input id="search-input" placeholder="ค้นหา..." autocomplete="off">
      <button id="left-panel-collapse" class="left-panel-toggle" title="Collapse panel">‹</button>
    </div>
    <div id="left-panel-inner"></div>
  </aside>
  <button id="left-panel-peek" class="left-panel-peek" title="Open panel">+</button>
  <main id="main-area"><div id="builder-tabs" aria-label="Open modules"></div><div id="main-inner"></div></main>
</div>
<footer id="status-bar"></footer>
</div>
<div id="modal-overlay" class="hidden">
  <div id="modal">
    <div id="modal-head"><span id="modal-title"></span><button id="modal-close">✕</button></div>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>
  <!-- i18n data + Core + Director loaded immediately; Timeline/Relation/Map/Hashtag lazy-loaded on first use -->

  <script src="src/renderer/markdown.js"></script>
  <script src="src/renderer/mdeditor.js"></script>
  <script src="src/renderer/core.js"></script>
  <script src="src/renderer/hub.js"></script>
  <script src="src/renderer/inspector.js"></script>
  <script src="src/renderer/iconpicker.js"></script>
  <script src="src/renderer/mod/classifier.js"></script>
  <script src="src/renderer/mod/manager.js"></script>
  <script src="src/renderer/mod/detail.js"></script>
  <script src="src/renderer/mod/locator.js"></script>
  <script src="src/renderer/mod/chronicler.js"></script>
  <script src="src/renderer/mod/narrator.js"></script>
  <script src="src/renderer/mod/author.js"></script>
  <script src="src/renderer/mod/chatscribe.js"></script>
  <script src="src/renderer/mod/drafter.js"></script>
  <script src="src/renderer/mod/viewer.js"></script>
  <script src="src/renderer/mod/connector.js"></script>
  <script src="src/renderer/mod/sketcher.js"></script>
  <script src="src/renderer/mod/designer.js"></script>
  <script src="src/renderer/mod/sagehut.js"></script>
  <script src="src/renderer/mod/wanderer.js"></script>
  <script src="src/renderer/director.js"></script>
  <script src="src/renderer/modals.js"></script>
  <script src="src/renderer/search.js"></script>
</body>
</html>
